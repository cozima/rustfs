# Temporary verification workflow for the fork only (not part of the upstream PR).
name: verify-cors-vhost
on:
  push:
    branches: [ "verify/**" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_TARGET_DIR: /mnt/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target
          df -h / /mnt
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'true'
      - name: Baseline - reproduce with the released image (expected to fail)
        run: |
          docker run -d --name baseline -p 9100:9000 -e RUSTFS_ACCESS_KEY=minio -e RUSTFS_SECRET_KEY=minio123 \
            -e RUSTFS_SERVER_DOMAINS=localhost -e RUSTFS_CONSOLE_ENABLE=false rustfs/rustfs:latest
          for i in $(seq 60); do curl -s -o /dev/null localhost:9100/health && break; sleep 2; done
          docker exec baseline rustfs --version || true
          if bash .github/verify/cors-vhost-check.sh localhost:9100; then echo "::warning::baseline unexpectedly passed"; else echo "baseline reproduces the bug (as expected)"; fi
          docker rm -f baseline
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (rustfs crate)
        run: cargo clippy -p rustfs --all-targets -- -D warnings
      - name: Unit tests (rate_limit, layer CORS, http server stack)
        run: cargo nextest run -p rustfs --lib -E 'test(/virtual_host|request_bucket|cors|vh_domain|s3_host_domains|external_service/)'
      - name: Build patched server
        run: cargo build -p rustfs --bin rustfs
      - name: Patched - virtual-hosted-style CORS
        run: |
          mkdir -p /tmp/data
          RUSTFS_ACCESS_KEY=minio RUSTFS_SECRET_KEY=minio123 RUSTFS_SERVER_DOMAINS=localhost RUSTFS_CONSOLE_ENABLE=false \
            RUSTFS_ADDRESS=:9000 RUSTFS_VOLUMES=/tmp/data "$CARGO_TARGET_DIR/debug/rustfs" server /tmp/data > /tmp/rustfs.log 2>&1 &
          for i in $(seq 90); do curl -s -o /dev/null localhost:9000/health && break; sleep 2; done
          bash .github/verify/cors-vhost-check.sh localhost:9000 || { tail -50 /tmp/rustfs.log; exit 1; }
